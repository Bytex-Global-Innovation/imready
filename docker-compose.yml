name: imready

services:
  mysql:
    image: mysql:8.0
    container_name: imready-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - imready

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: imready-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overridden regardless of .env — the API must reach MySQL via the
      # compose service name, not localhost or the host-published port.
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 4000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    init: true
    networks:
      - imready

  # One-off migration runner — not started by `docker compose up`.
  # Usage: docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    container_name: imready-migrate
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - imready
    profiles:
      - tools

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    container_name: imready-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    init: true
    networks:
      - imready

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: imready-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    init: true
    networks:
      - imready

volumes:
  mysql-data:
  backend-uploads:

networks:
  imready:
    driver: bridge
