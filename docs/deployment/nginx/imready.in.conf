# IMReady — Nginx site snippets (NEW FILE ONLY — do not replace ByteX configs)
#
# Install as separate files under /etc/nginx/sites-available/ (Debian/Ubuntu)
# or include from conf.d/. Symlink to sites-enabled after `nginx -t`.
#
# Prerequisites:
#   - DNS A records for imready.in, admin.imready.in, api.imready.in → VPS IP
#   - IMReady stack listening on localhost (see docker-compose.prod.yml)
#   - client_max_body_size for PDF uploads on API vhost
#
# TLS: use certbot certonly --nginx -d imready.in -d admin.imready.in -d api.imready.in
#       only AFTER DNS propagates and this config is validated.

# --- Student app: https://imready.in ---
server {
    listen 80;
    listen [::]:80;
    server_name imready.in www.imready.in;

    # After certbot, certbot will add SSL listen directives or use a separate ssl server block.

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin: https://admin.imready.in ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.imready.in;

    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API + uploads: https://api.imready.in ---
server {
    listen 80;
    listen [::]:80;
    server_name api.imready.in;

    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:14000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
